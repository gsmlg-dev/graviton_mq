name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string
      git_ref:
        description: "Git ref to release from (must be a branch)"
        required: true
        default: main
        type: string

permissions:
  contents: write

# Never cancel a run that may be publishing. Runs for the same version queue;
# runs for different versions are fenced by the atomic push before publishing.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  MIX_ENV: prod
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_REF: ${{ inputs.git_ref }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Validate release prerequisites
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          test -n "$HEX_API_KEY" || { echo "HEX_API_KEY must be configured" >&2; exit 1; }
          git check-ref-format "refs/heads/$RELEASE_REF"
          remote_sha=$(git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_REF" | cut -f1)
          test "$remote_sha" = "$(git rev-parse HEAD)" || { echo "git_ref must name the checked-out branch" >&2; exit 1; }
          tag="v$RELEASE_VERSION"
          tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || tag_status=$?
          case "$tag_status" in
            0)
              # The tag is pushed before publishing, so an existing tag means an
              # earlier run stopped during publication. Resume from that commit.
              git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
              tag_sha=$(git rev-parse "$tag^{commit}")
              git merge-base --is-ancestor "$tag_sha" HEAD || { echo "Release tag $tag is not on $RELEASE_REF" >&2; exit 1; }
              git checkout --detach "$tag_sha"
              test "$(cat VERSION)" = "$RELEASE_VERSION" || { echo "Release tag $tag does not carry VERSION $RELEASE_VERSION" >&2; exit 1; }
              echo "Resuming publication of existing tag $tag ($tag_sha)"
              echo "RELEASE_RESUME=true" >> "$GITHUB_ENV"
              ;;
            2)
              elixir scripts/set_version.exs "$RELEASE_VERSION"
              echo "RELEASE_RESUME=false" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Cannot determine whether release tag $tag exists" >&2
              exit 1
              ;;
          esac

      - name: Cache dependencies and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-prod-${{ hashFiles('.tool-versions', '**/mix.exs', 'mix.lock', 'VERSION', 'build/project.exs') }}

      - name: Validate release source
        run: |
          mix deps.get
          mix format --check-formatted
          mix compile --warnings-as-errors
          MIX_ENV=test mix test
          mix graviton_mq.check_architecture
          mix xref graph --format cycles --fail-above 0

      - name: Stage standalone Hex packages
        run: elixir scripts/stage_hex.exs "$RUNNER_TEMP/graviton_mq_hex"

      - name: Build and verify every archive before publishing
        run: elixir scripts/build_hex.exs "$RUNNER_TEMP/graviton_mq_hex"

      # Push before publishing: a rejected push leaves nothing on Hex, and a
      # failed publication is completed by re-running, which resumes from the tag.
      - name: Commit and push synchronized version and tag
        if: env.RELEASE_RESUME != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v$RELEASE_VERSION"
          fi
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_REF" "refs/tags/v$RELEASE_VERSION"

      - name: Publish all packages to Hex in dependency order
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          while IFS= read -r package; do
            metadata="$RUNNER_TEMP/graviton_mq_hex/$package-release.json"
            status=$(curl --silent --show-error --location --output "$metadata" --write-out '%{http_code}' \
              "https://hex.pm/api/packages/$package/releases/$RELEASE_VERSION")
            case "$status" in
              200)
                expected=$(sha256sum "$RUNNER_TEMP/graviton_mq_hex/artifacts/$package.tar" | cut -d ' ' -f1)
                actual=$(jq -er '.checksum' "$metadata")
                test "$actual" = "$expected" || {
                  echo "Published archive differs: $package $RELEASE_VERSION" >&2
                  exit 1
                }
                echo "Verified existing publication: $package $RELEASE_VERSION ($actual)"
                ;;
              404)
                (cd "$RUNNER_TEMP/graviton_mq_hex/$package" && mix deps.get && mix hex.publish package --yes)
                ;;
              *)
                echo "Cannot verify Hex publication state: $package (HTTP $status)" >&2
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/graviton_mq_hex/packages.txt"

      - name: Create GitHub Release with Hex archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$RELEASE_VERSION" > /dev/null 2>&1; then
            gh release upload "v$RELEASE_VERSION" --clobber "$RUNNER_TEMP/graviton_mq_hex/artifacts/"*.tar
            exit 0
          fi
          release_options=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "v$RELEASE_VERSION" \
            --verify-tag --generate-notes --title "v$RELEASE_VERSION" \
            "${release_options[@]}" "$RUNNER_TEMP/graviton_mq_hex/artifacts/"*.tar
